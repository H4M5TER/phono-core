[workspace]
name = "phono-core-env"
description = "phono core compile environment"
channels = ["conda-forge"]
platforms = [
    { name = "linux-glibc228", platform = "linux-64", glibc = "2.28" },
    { name = "win-64", platform = "win-64" }
]

[dependencies]
python = "=3.13.15"
ninja = "*"
cmake = "*"
pip = "*"
just = "*"

c-compiler = "*"
cxx-compiler = "*"

[pypi-dependencies]
torch = "==2.14.0"
pyyaml = "==6.0.3"

[target.linux-64.pypi-dependencies]
torch = { url = "https://download.pytorch.org/whl/cpu/torch-2.14.0%2Bcpu-cp313-cp313-manylinux_2_28_x86_64.whl" }

[tasks]
setup = """
  mkdir -p third_party/executorch
  just prepare-executorch
"""
format = "black . && isort ."
lint = "flake8 . && mypy ."
config = "cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DPHONO_DTYPE_SELECTIVE_BUILD=OFF"
build = "cmake --build build"
test = "ctest --test-dir build --output-on-failure"

[environments]
default = { features = [], solve-group = "default" }
