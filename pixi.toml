[workspace]
name = "phono-core-env"
description = "phono core compile environment"
channels = ["conda-forge"]
platforms = [
  "linux-64",
  "linux-aarch64",
  "win-64",
  { name = "osx-arm64-14", platform="osx-arm64", macos = "14" }, # torch 2.14 requires macos 14+
]

[dependencies]
python = "=3.13.15"
ninja = "*"
cmake = "*"
pip = "*"
just = "*"

c-compiler = "*"
cxx-compiler = "*"

pyyaml = "=6.0.3"
flatbuffers = "=24.3.25" # third_party/executorch/third-party/flatbuffers/include/flatbuffers/base.h#142

[pypi-dependencies]
torch = {
  version = "==2.14.0", 
  index = "https://download.pytorch.org/whl/cpu",
}


[tasks]
setup = """
  mkdir -p third_party/executorch
  just prepare-executorch
"""
format = "black . && isort ."
lint = "flake8 . && mypy ."
config = "cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DPHONO_DTYPE_SELECTIVE_BUILD=OFF"
build = "cmake --build build"
test = "ctest --test-dir build --output-on-failure"

[environments]
default = { features = [], solve-group = "default" }
