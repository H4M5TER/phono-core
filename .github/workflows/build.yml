name: Build and release the core SDK

on:
  pull_request:
  workflow_dispatch:
    inputs:
      model_tests:
        description: Verify both pinned models as in a release
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            manifest: ci/pixi.toml
          - os: windows-2022
            platform: windows-x64
            manifest: pixi.toml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.81.0
          manifest-path: ${{ matrix.manifest }}
          locked: true
          cache: true
      - name: Validate version and release ancestry
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PIXI_MANIFEST: ${{ matrix.manifest }}
        run: |
          if test -n "$RELEASE_TAG"; then
            pixi run --locked --manifest-path "$PIXI_MANIFEST" python tools/release_version.py --tag "$RELEASE_TAG"
            git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
          else
            pixi run --locked --manifest-path "$PIXI_MANIFEST" python tools/release_version.py
          fi
      - name: Build and test Linux SDK with the locked glibc 2.28 toolchain
        if: runner.os == 'Linux'
        run: pixi run --locked --manifest-path ci/pixi.toml python tools/ci_build_core.py --source . --prefix build/sdk --build-dir build/linux-sdk --jobs 4
      - name: Build and test Windows x64 SDK
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          pixi run --locked python tools/build_sdk.py --prefix build/sdk --build-dir build/windows-sdk --jobs 4
      - name: Verify both required model formats
        if: github.event_name == 'release' || inputs.model_tests == true
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          PIXI_MANIFEST: ${{ matrix.manifest }}
        run: |
          pixi run --locked --manifest-path "$PIXI_MANIFEST" python tools/fetch_models.py --precision w4a8 --path-file build/w4a8-path.txt
          pixi run --locked --manifest-path "$PIXI_MANIFEST" python tools/fetch_models.py --precision w8a8 --path-file build/w8a8-path.txt
          if test "$PLATFORM" = linux-x86_64; then
            native=build/linux-sdk/native
            runtime=build/linux-sdk/runtime
          else
            native=build/windows-sdk
            runtime=build/windows-sdk/bin
          fi
          pixi run --locked --manifest-path "$PIXI_MANIFEST" python tools/test_models.py --build-dir "$native" --runtime-dir "$runtime" --model-dir "$(cat build/w4a8-path.txt)" --model-dir "$(cat build/w8a8-path.txt)"
      - name: Package tested SDK and demos
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          PIXI_MANIFEST: ${{ matrix.manifest }}
        run: |
          if test "$PLATFORM" = linux-x86_64; then native=build/linux-sdk/native; else native=build/windows-sdk; fi
          pixi run --locked --manifest-path "$PIXI_MANIFEST" python tools/package_sdk.py --prefix build/sdk --build-dir "$native" --platform "$PLATFORM"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phono-core-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  upload:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: phono-core-*
          merge-multiple: true
          path: dist
      - name: Upload verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
